<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.photo{position:absolute;left:0;right:0;top:0;height:1180px;background-size:cover;background-position:center 18%}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,46,.55) 0%,rgba(6,18,46,0) 22%,rgba(10,31,77,0) 55%,var(--navy) 98%)}
.info{position:absolute;left:70px;right:70px;top:1030px}
.badge{display:inline-block;background:var(--red);font-weight:900;font-size:30px;letter-spacing:5px;text-transform:uppercase;padding:12px 26px;transform:skewX(-8deg)}
.prenom{font-size:70px;font-weight:700;margin-top:34px;letter-spacing:-1px}
.nom{font-size:150px;font-weight:900;line-height:.92;text-transform:uppercase;letter-spacing:-5px}
.parti{margin-top:34px;display:flex;align-items:center;gap:22px;font-size:50px;font-weight:800}
.parti .bar{width:12px;height:64px;background:var(--red);transform:skewX(-12deg)}
.note{margin-top:22px;font-size:32px;color:var(--grey);font-weight:600}
.credit{position:absolute;left:70px;right:70px;bottom:300px;font-size:22px;color:var(--grey);opacity:.8}
</style></head><body>
<div class="photo" id="photo"></div>
<img class="logo" src="../assets/logo.png"><div class="tag">Candidat déclaré</div>
<div class="info"><span class="badge">Présidentielle 2027</span>
<div class="prenom" id="prenom"></div><div class="nom" id="nom"></div>
<div class="parti"><div class="bar"></div><span id="parti"></span></div><div class="note" id="note"></div></div>
<div class="credit" id="credit"></div>
<script>
const id=new URLSearchParams(location.search).get('id');
Promise.all([fetch('../candidats.json').then(r=>r.json()),fetch('../assets/candidats/credits.json').then(r=>r.json())]).then(([L,C])=>{
 const c=L.find(x=>x.id===id), cr=C[id]||{};
 document.getElementById('photo').style.backgroundImage=`url(../assets/candidats/${id}.jpg)`;
 prenom.textContent=c.nom; nom.textContent=c.nom2; parti.textContent=c.parti; note.textContent=c.note;
 credit.textContent=`Photo : ${cr.auteur||''} · ${cr.licence||''} · Wikimedia Commons`;
 document.body.dataset.ready=1;
});
</script></body></html>
