<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.photo{position:absolute;left:0;right:0;top:0;height:1000px;
  background:radial-gradient(circle at 50% 38%,rgba(70,110,200,.55) 0%,rgba(23,48,107,.3) 55%,rgba(13,32,77,0) 80%);}
.silhouette{position:absolute;left:50%;top:240px;transform:translateX(-50%);width:520px;opacity:.35}
.silhouette .h{width:230px;height:260px;border-radius:50%;background:#fff;margin:0 auto}
.silhouette .b{width:520px;height:330px;border-radius:260px 260px 0 0;background:#fff;margin-top:20px}
.photo-note{position:absolute;top:560px;width:100%;text-align:center;font-weight:800;letter-spacing:6px;color:#fff;opacity:.8;font-size:26px}
.quote{position:absolute;left:70px;right:70px;top:880px}
.mark{font-size:260px;line-height:.5;color:var(--red);font-weight:900;height:110px}
.quote p{font-size:78px;font-weight:900;line-height:1.05;letter-spacing:-2px}
.quote p b{color:var(--red);font-weight:900}
.who{margin-top:44px;display:flex;align-items:center;gap:22px}
.who .bar{width:12px;height:84px;background:var(--red);transform:skewX(-12deg)}
.who .n{font-size:46px;font-weight:900;text-transform:uppercase}
.who .r{font-size:30px;color:var(--grey);font-weight:600}
</style></head><body>
<div class="photo"><div class="silhouette"><div class="h"></div><div class="b"></div></div>
<div class="photo-note">[ PHOTO DU CANDIDAT ]</div></div>
<img class="logo" src="../assets/logo.png"><div class="tag">Déclaration</div>
<div class="quote"><div class="mark">“</div>
<p>Cinq mois avant l'élection, <b>je prends acte</b> de l'impasse et je m'engage pour <b>l'union</b>.</p>
<div class="who"><div class="bar"></div><div><div class="n">Prénom Nom</div><div class="r">Candidat(e) · Parti</div></div></div></div>
<div class="source">Source : média / date de la déclaration</div>
<div class="fiction">Exemple fictif — texte à remplacer</div>
</body></html>
