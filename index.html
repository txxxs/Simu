<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simu — Test politique</title>
  <meta name="description" content="Test politique complet sur 12 axes : boussole, radar et courants les plus proches. FR / EN.">
  <meta name="theme-color" content="#0a0e27">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="top">
    <a class="brand" href="./" id="brand"><span class="logo">🧭</span><span data-i18n="brand">Simu</span></a>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="fr" aria-pressed="true">FR</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
    <!-- ACCUEIL -->
    <section id="home" class="view active">
      <span class="badge" data-i18n="hero.badge"></span>
      <h1><span data-i18n="hero.title1"></span><br><span class="grad" data-i18n="hero.title2"></span></h1>
      <p class="sub" data-i18n="hero.sub"></p>

      <div class="country-row" id="countryRow" hidden>
        <label for="country" data-i18n="country"></label>
        <select id="country"></select>
      </div>

      <div class="modes">
        <button class="mode" data-mode="short" aria-pressed="true">
          <b data-i18n="mode.short"></b><small data-i18n="mode.short.d"></small>
        </button>
        <button class="mode" data-mode="full" aria-pressed="false">
          <b data-i18n="mode.full"></b><small data-i18n="mode.full.d"></small>
        </button>
      </div>
      <button class="cta" id="startBtn"><span data-i18n="start"></span> →</button>
      <p class="priv" data-i18n="priv"></p>
    </section>

    <!-- QUESTIONS -->
    <section id="quiz" class="view">
      <div class="quiz-top">
        <button class="ghost" id="backBtn" data-i18n="back"></button>
        <span class="count" id="qCount"></span>
        <button class="ghost" id="quitBtn" data-i18n="quit"></button>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <article class="card qcard" id="qCard">
        <div class="chip" id="qChip"></div>
        <h2 id="qText"></h2>
        <div class="answers" id="answers"></div>
        <div class="ans-label" id="ansLabel" aria-live="polite">&nbsp;</div>
      </article>
      <button class="ghost center" id="skipBtn" data-i18n="skip"></button>
    </section>

    <!-- RÉSULTATS -->
    <section id="results" class="view">
      <h1 class="res-h" data-i18n="res.title"></h1>

      <article class="card hero-res" id="heroRes"></article>

      <div class="grid2">
        <article class="card">
          <h3 data-i18n="res.compass"></h3>
          <div id="compass" class="viz"></div>
        </article>
        <article class="card">
          <h3 data-i18n="res.radar"></h3>
          <div id="radar" class="viz"></div>
        </article>
      </div>

      <article class="card">
        <h3 data-i18n="res.axes"></h3>
        <div id="axesBars"></div>
      </article>

      <article class="card">
        <h3 data-i18n="res.ranking"></h3>
        <div id="ranking"></div>
        <button class="ghost center" id="moreBtn"></button>
        <p class="note" data-i18n="res.ranking.note"></p>
      </article>

      <div class="actions">
        <button class="cta" id="imgBtn" data-i18n="share.img"></button>
        <button class="cta alt" id="linkBtn" data-i18n="share.link"></button>
        <button class="cta alt" id="retakeBtn" data-i18n="retake"></button>
      </div>
      <p class="note center" data-i18n="disc"></p>
    </section>
  </main>

  <footer class="foot"><span data-i18n="footer"></span></footer>
  <div class="toast" id="toast" role="status"></div>

  <script src="data/axes.js"></script>
  <script src="data/fr.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
