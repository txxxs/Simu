<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simu Politique</title>
  <meta name="description" content="Test politique sur 12 axes : partis 2027, idéologies, pays et personnalités les plus proches. FR / EN.">
  <meta name="theme-color" content="#4b2a6e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='%23f7d866' stroke='%231f1030' stroke-width='3'/%3E%3Ccircle cx='24' cy='24' r='13' stroke='%231f1030' stroke-width='3' fill='none'/%3E%3Cpath d='M31 17l-5 10-10 5 5-10z' fill='%231f1030'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./" id="brand" aria-label="Simu"><span class="logo" id="logo"></span><span class="wordmark">Si<i>mu</i></span></a>
    <span class="beta">BETA</span>
    <div class="tools">
      <button class="rbtn" id="langBtn" aria-label="Langue / Language">FR</button>
      <button class="rbtn" id="fsBtn" aria-label="Taille du texte"><span class="aa">A<small>A</small></span></button>
      <button class="rbtn yellow" id="themeBtn" aria-label="Contraste / thème"><span class="ui" data-icon="contrast"></span></button>
    </div>
  </header>

  <main>
    <!-- ACCUEIL -->
    <section id="home" class="view active">
      <h1 class="hero-h st" style="--i:0">
        <span class="hl y" data-i18n="hero.title1"></span>
        <span class="hl p" data-i18n="hero.title2"></span>
        <span class="hl c" data-i18n="hero.title3"></span>
      </h1>
      <p class="tagline st" style="--i:1" data-i18n="hero.tag"></p>
      <h2 class="pick st" style="--i:2"><span data-i18n="pick.q"></span> <em data-i18n="pick.a"></em></h2>

      <div class="country-row st" style="--i:3" id="countryRow" hidden>
        <label for="country" data-i18n="country"></label>
        <select id="country"></select>
      </div>

      <div class="modes st" style="--i:3">
        <button class="mode" data-mode="short" aria-pressed="true">
          <span class="mnum">4<small>min</small></span>
          <b data-i18n="mode.short"></b>
          <span class="mtag" data-i18n="mode.short.q"></span>
        </button>
        <button class="mode" data-mode="full" aria-pressed="false">
          <span class="mnum">10<small>min</small></span>
          <b data-i18n="mode.full"></b>
          <span class="mtag" data-i18n="mode.full.q"></span>
        </button>
        <button class="mode wide" data-mode="deep" aria-pressed="false">
          <span class="mnum">16<small>+ min</small></span>
          <b data-i18n="mode.deep"></b>
          <span class="mtag" data-i18n="mode.deep.q"></span>
        </button>
      </div>
      <button class="cta st" style="--i:4" id="startBtn"><span data-i18n="start"></span><span class="ui" data-icon="next"></span></button>
      <p class="priv st" style="--i:5"><span class="ui" data-icon="lock"></span><span data-i18n="priv"></span></p>
    </section>

    <!-- QUESTIONS -->
    <section id="quiz" class="view">
      <div class="quiz-top">
        <button class="rbtn small" id="backBtn" aria-label="Retour"><span class="ui" data-icon="back"></span></button>
        <span class="count" id="qCount"></span>
        <button class="rbtn small" id="quitBtn" aria-label="Quitter"><span class="ui" data-icon="close"></span></button>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <article class="card qcard" id="qCard">
        <div class="chip" id="qChip"></div>
        <h2 id="qText"></h2>
        <div class="answers" id="answers"></div>
        <div class="ans-label" id="ansLabel" aria-live="polite"></div>
      </article>
      <div class="quiz-bottom">
        <button class="ghost" id="skipBtn"><span data-i18n="skip"></span><span class="ui" data-icon="skip"></span></button>
        <small class="hint" data-i18n="hint"></small>
      </div>
    </section>

    <!-- CALCUL -->
    <section id="calc" class="view">
      <div class="calc-box">
        <div class="calc-logo" id="calcLogo"></div>
        <h2 data-i18n="calc.title"></h2>
        <p data-i18n="calc.sub"></p>
        <div class="calc-icons" id="calcIcons"></div>
        <div class="calc-bar"><i></i></div>
      </div>
    </section>

    <!-- RÉSULTATS -->
    <section id="results" class="view">
      <h1 class="res-h"><span class="hl y" data-i18n="res.title"></span></h1>

      <article class="card reveal hero-res" id="heroRes"></article>

      <article class="card reveal" id="sumCard"></article>

      <div class="grid2">
        <article class="card reveal">
          <h3 data-i18n="res.compass"></h3>
          <div class="tabs small" id="compassTabs"></div>
          <div id="compass" class="viz"></div>
        </article>
        <article class="card reveal">
          <h3 data-i18n="res.radar"></h3>
          <div id="radar" class="viz"></div>
          <div class="legend" id="radarLegend"></div>
        </article>
      </div>

      <article class="card reveal" id="matchCard">
        <h3 data-i18n="match.title"></h3>
        <div class="tabs" id="matchTabs"></div>
        <div class="prio">
          <b data-i18n="prio.title"></b><small data-i18n="prio.sub"></small>
          <div class="chips" id="prioChips"></div>
        </div>
        <div id="matchList"></div>
        <button class="ghost center" id="moreBtn"></button>
        <p class="note" data-i18n="match.note"></p>
      </article>

      <article class="card reveal" id="axesCard">
        <h3 data-i18n="res.axes"></h3>
        <div id="axesBars"></div>
      </article>

      <div class="actions reveal">
        <button class="cta" id="imgBtn"><span class="ui" data-icon="image"></span><span data-i18n="share.img"></span></button>
        <button class="cta alt" id="linkBtn"><span class="ui" data-icon="link"></span><span data-i18n="share.link"></span></button>
        <button class="cta alt" id="retakeBtn"><span class="ui" data-icon="refresh"></span><span data-i18n="retake"></span></button>
      </div>
      <p class="note center" data-i18n="disc"></p>
    </section>

    <!-- MÉTHODE -->
    <section id="about" class="view">
      <h1 class="res-h"><span class="hl p" data-i18n="about.title"></span></h1>
      <article class="card prose">
        <h3 data-i18n="about.h1"></h3><p data-i18n="about.p1"></p>
        <h3 data-i18n="about.h2"></h3><p data-i18n="about.p2"></p>
        <h3 data-i18n="about.h3"></h3><p data-i18n="about.p3"></p>
        <h3 data-i18n="about.h4"></h3><p data-i18n="about.p4"></p>
        <h3 data-i18n="about.h5"></h3><p data-i18n="about.p5"></p>
      </article>
    </section>
  </main>

  <nav class="tabbar" aria-label="Navigation">
    <button data-nav="test" aria-current="page"><span class="ui" data-icon="list"></span><span data-i18n="nav.test"></span></button>
    <button data-nav="results"><span class="ui" data-icon="chart"></span><span data-i18n="nav.results"></span></button>
    <button data-nav="about"><span class="ui" data-icon="info"></span><span data-i18n="nav.about"></span></button>
  </nav>

  <div class="modal" id="shareModal" hidden role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="modal-box">
      <button class="rbtn small modal-x" id="shareClose" aria-label="Fermer"><span class="ui" data-icon="close"></span></button>
      <h3 id="shareTitle" data-i18n="share.modal.t"></h3>
      <img id="shareImg" alt="Image de partage Simu">
      <p class="note center" data-i18n="share.modal.h"></p>
      <a class="cta" id="shareDl" href="#" download="simu.png"><span class="ui" data-icon="image"></span><span data-i18n="share.dl"></span></a>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="data/axes.js"></script>
  <script src="data/fr-ches.js"></script>
  <script src="data/fr-parties.js"></script>
  <script src="data/fr.js"></script>
  <script src="data/world.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
